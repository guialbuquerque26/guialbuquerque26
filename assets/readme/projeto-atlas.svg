<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Atlas</title>
  <desc id="descricao">IA multimodal 100% local: analisa imagens, vídeos e documentos, pesquisa na web e mantém memória semântica, sem chaves de API nem nuvem.</desc>

  <rect width="1200" height="330" rx="20" fill="#0B0F14"/>
  <path d="M0 52V20A20 20 0 0 1 20 0H1180A20 20 0 0 1 1200 20V52Z" fill="#141A21"/>
  <rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#2A3340" stroke-width="2"/>
  <circle cx="34" cy="26" r="8" fill="#3A4552"/>
  <circle cx="60" cy="26" r="8" fill="#3A4552"/>
  <circle cx="86" cy="26" r="8" fill="#3A4552"/>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="33" text-anchor="middle" font-size="20" fill="#8A97A6">~/Atlas</text>

    <g id="identidade">
      <text x="48" y="136" font-size="72" font-weight="700" fill="#E8EEF4">Atlas</text>
      <text x="48" y="186" font-size="30" font-weight="700" fill="#F5B454">IA multimodal 100% local</text>
      <text x="48" y="234" font-size="24" fill="#E8EEF4">Sem chaves de API.</text>
      <text x="48" y="266" font-size="24" fill="#E8EEF4">Sem nuvem.</text>
